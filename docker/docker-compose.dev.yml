version: '3.8'

# Development infrastructure - app runs locally via `pnpm dev`
# Services: postgres, mailhog (email testing)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nvyt
      POSTGRES_PASSWORD: nvyt
      POSTGRES_DB: nvyt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvyt"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    logging:
      driver: none    # Disable logging to reduce noise

volumes:
  postgres_data:
