# Development infrastructure - app runs locally via `pnpm dev`
# Services: postgres, mailhog (email testing), minio (S3 storage)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nvyt
      POSTGRES_PASSWORD: nvyt
      POSTGRES_DB: nvyt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvyt"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    logging:
      driver: none    # Disable logging to reduce noise

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/nvyt-uploads --ignore-existing;
      mc anonymous set download minio/nvyt-uploads;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
