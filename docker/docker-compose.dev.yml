version: '3.8'

# Development compose - just databases, app runs locally
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nvyt
      POSTGRES_PASSWORD: nvyt
      POSTGRES_DB: nvyt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvyt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
