name: Production Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infra/**'
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - 'LICENSE'

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: [self-hosted, k3s, nvyt-staging]
    environment: production

    env:
      REGISTRY: 192.168.0.20:30500
      WEB_IMAGE: nvyt-web
      MIGRATE_IMAGE: nvyt-migrate
      NAMESPACE: nvyt-production

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Configure kubectl
        run: |
          # Use in-cluster ServiceAccount credentials
          kubectl config set-cluster k3s --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials github-runner --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context default --cluster=k3s --user=github-runner
          kubectl config use-context default
          # Verify access to nvyt-production namespace
          kubectl get pods -n ${{ env.NAMESPACE }} --no-headers | head -1

      - name: Generate image tag
        id: tag
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${TAG}"

      - name: Build web image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }} \
            .

      - name: Push web image
        run: |
          # Push only the immutable tag — do NOT push :latest. The local
          # registry's nvyt-web:latest is shared with staging.
          docker push ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build migrate image
        run: |
          docker build \
            -f docker/Dockerfile.migrate \
            -t ${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE }}:${{ steps.tag.outputs.tag }} \
            .

      - name: Push migrate image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Run database migrations
        run: |
          # Delete any existing migration job
          kubectl delete job db-migrate -n ${{ env.NAMESPACE }} --ignore-not-found=true

          # Apply migration job with new image tag
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: nvyt-migrate
              environment: production
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: nvyt-migrate
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE }}:${{ steps.tag.outputs.tag }}
                    imagePullPolicy: Always
                    envFrom:
                      - configMapRef:
                          name: nvyt-config
                      - secretRef:
                          name: nvyt-secrets
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "100m"
                      limits:
                        memory: "512Mi"
                        cpu: "250m"
          EOF

          # Wait for migration to complete
          echo "Waiting for migration job to complete..."
          kubectl wait --for=condition=complete job/db-migrate -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy to k3s
        run: |
          # Update the deployment with the new immutable image tag
          kubectl set image deployment/nvyt-web \
            web=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }} \
            -n ${{ env.NAMESPACE }}

          # Wait for rollout to complete
          kubectl rollout status deployment/nvyt-web -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify health check
        run: |
          echo "Verifying production health check..."

          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nvyt.app/api/health)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed! Status: ${HTTP_STATUS}"
              exit 0
            fi

            echo "Attempt $i/30: Health check returned ${HTTP_STATUS}, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 30 attempts"
          exit 1
