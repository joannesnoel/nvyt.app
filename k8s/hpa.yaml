apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nvyt-web-hpa
  namespace: nvyt-staging
  labels:
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nvyt-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
