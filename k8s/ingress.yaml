apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nvyt-ingress
  namespace: nvyt
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: nvyt.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nvyt-web-service
                port:
                  number: 80
    - host: www.nvyt.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nvyt-web-service
                port:
                  number: 80
