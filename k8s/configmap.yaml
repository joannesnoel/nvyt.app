apiVersion: v1
kind: ConfigMap
metadata:
  name: nvyt-config
  namespace: nvyt-staging
  labels:
    environment: staging
data:
  APP_URL: "https://staging.nvyt.app"
  NODE_ENV: "staging"
  # Disable SSL for internal PostgreSQL (no SSL support)
  DB_SSL: "false"
  # Comma-separated list of admin emails
  ADMIN_EMAILS: "jon@creativelogik.net,hello@nvyt.app"
  # PayMongo payment methods (comma-separated, leave empty for defaults: gcash,paymaya,card,grab_pay,qrph)
  # Available: gcash, paymaya, card, grab_pay, qrph, dob, dob_ubp (dob/dob_ubp require PayMongo activation)
  PAYMONGO_PAYMENT_METHODS: ""
