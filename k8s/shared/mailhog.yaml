# Shared Mailhog service for email testing across all projects
# SMTP: mailhog.mailhog.svc.cluster.local:1025
# Web UI: mail.local.nvyt.app (or via NodePort 30825)
---
apiVersion: v1
kind: Namespace
metadata:
  name: mailhog
  labels:
    app.kubernetes.io/name: mailhog
    purpose: shared-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: mailhog
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:latest
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Mailhog doesn't need persistence - emails are stored in memory
          # This is fine for testing/staging environments
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: mailhog
  labels:
    app: mailhog
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
  type: ClusterIP
---
# NodePort service for direct access to web UI (optional)
apiVersion: v1
kind: Service
metadata:
  name: mailhog-nodeport
  namespace: mailhog
  labels:
    app: mailhog
spec:
  type: NodePort
  selector:
    app: mailhog
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: 30825
---
# Ingress for web UI access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailhog-ingress
  namespace: mailhog
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: mail.staging.nvyt.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailhog
                port:
                  number: 8025
