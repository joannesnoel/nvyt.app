---
# Secret for GitHub PAT - create manually:
# kubectl create secret generic github-runner-secret \
#   --namespace github-actions \
#   --from-literal=GITHUB_PAT=<your-pat-token>
---
# ServiceAccount for the runner
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
  namespace: github-actions

---
# Role for accessing nvyt-staging namespace resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-role
  namespace: nvyt-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]

---
# RoleBinding to bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-binding
  namespace: nvyt-staging
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-actions
roleRef:
  kind: Role
  name: github-runner-role
  apiGroup: rbac.authorization.k8s.io

---
# Role for accessing nvyt-production namespace resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-role
  namespace: nvyt-production
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]

---
# RoleBinding to bind the role to the service account in nvyt-production
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-binding
  namespace: nvyt-production
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-actions
roleRef:
  kind: Role
  name: github-runner-role
  apiGroup: rbac.authorization.k8s.io

---
# Deployment for the self-hosted runner with Docker-in-Docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-actions
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      containers:
        # Docker-in-Docker sidecar
        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true
          args:
            - --insecure-registry=192.168.0.20:30500
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: runner-workdir
              mountPath: /tmp/runner
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

        # GitHub Actions Runner
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: Always
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: REPO_URL
              value: "https://github.com/joannesnoel/nvyt.app"
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_WORKDIR
              value: "/tmp/runner"
            - name: LABELS
              value: "self-hosted,k3s,nvyt-staging"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: GITHUB_PAT
            - name: RUNNER_SCOPE
              value: "repo"
            - name: DISABLE_AUTO_UPDATE
              value: "true"
          volumeMounts:
            - name: runner-workdir
              mountPath: /tmp/runner
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

      volumes:
        - name: docker-storage
          emptyDir: {}
        - name: runner-workdir
          emptyDir: {}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
