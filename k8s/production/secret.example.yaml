# PRODUCTION SECRETS — TEMPLATE ONLY. DO NOT PUT REAL VALUES HERE.
#
# Copy this file to k8s/production/secret.yaml, fill in the LIVE values, and
# apply it manually:
#
#   cp k8s/production/secret.example.yaml k8s/production/secret.yaml
#   # edit secret.yaml with live values
#   kubectl apply -f k8s/production/secret.yaml
#
# k8s/production/secret.yaml is git-ignored and must never be committed.
# The current live values live in AWS Secrets Manager; pull them before the
# AWS stack is torn down:
#   aws secretsmanager get-secret-value --secret-id nvyt-production/app-secrets
#   aws secretsmanager get-secret-value --secret-id nvyt-production/db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: nvyt-db-secrets
  namespace: nvyt-production
  labels:
    environment: production
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<STRONG_DB_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: nvyt-secrets
  namespace: nvyt-production
  labels:
    environment: production
type: Opaque
stringData:
  # Database (in-cluster postgres-service). Password must match nvyt-db-secrets.
  DATABASE_URL: "postgresql://nvyt:<STRONG_DB_PASSWORD>@postgres-service:5432/nvyt"
  NUXT_DATABASE_URL: "postgresql://nvyt:<STRONG_DB_PASSWORD>@postgres-service:5432/nvyt"
  # Auth
  JWT_SECRET: "<LIVE_JWT_SECRET>"
  NUXT_JWT_SECRET: "<LIVE_JWT_SECRET>"
  # PayMongo (LIVE keys)
  PAYMONGO_PUBLIC_KEY: "<LIVE_PAYMONGO_PUBLIC_KEY>"
  PAYMONGO_SECRET_KEY: "<LIVE_PAYMONGO_SECRET_KEY>"
  PAYMONGO_WEBHOOK_SECRET: "<LIVE_PAYMONGO_WEBHOOK_SECRET>"
  NUXT_PAYMONGO_SECRET_KEY: "<LIVE_PAYMONGO_SECRET_KEY>"
  NUXT_PAYMONGO_WEBHOOK_SECRET: "<LIVE_PAYMONGO_WEBHOOK_SECRET>"
  NUXT_PUBLIC_PAYMONGO_PUBLIC_KEY: "<LIVE_PAYMONGO_PUBLIC_KEY>"
  # PayPal (LIVE)
  PAYPAL_CLIENT_ID: "<LIVE_PAYPAL_CLIENT_ID>"
  PAYPAL_CLIENT_SECRET: "<LIVE_PAYPAL_CLIENT_SECRET>"
  PAYPAL_MODE: "live"
  PAYPAL_WEBHOOK_ID: "<LIVE_PAYPAL_WEBHOOK_ID>"
  NUXT_PUBLIC_PAYPAL_CLIENT_ID: "<LIVE_PAYPAL_CLIENT_ID>"
  # Email (Resend + SMTP)
  RESEND_API_KEY: "<LIVE_RESEND_API_KEY>"
  NUXT_SMTP_HOST: "<SMTP_HOST>"
  NUXT_SMTP_PORT: "<SMTP_PORT>"
  NUXT_SMTP_USER: "<SMTP_USER>"
  NUXT_SMTP_PASS: "<SMTP_PASS>"
  NUXT_SMTP_FROM: "nvyt <noreply@nvyt.app>"
  NUXT_SMTP_SECURE: "true"
  # Maps
  GOOGLE_MAPS_API_KEY: "<LIVE_GOOGLE_MAPS_API_KEY>"
  NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: "<LIVE_GOOGLE_MAPS_API_KEY>"
  # Real-time (Pusher)
  PUSHER_APP_ID: "<PUSHER_APP_ID>"
  PUSHER_SECRET: "<PUSHER_SECRET>"
  NUXT_PUSHER_APP_ID: "<PUSHER_APP_ID>"
  NUXT_PUSHER_SECRET: "<PUSHER_SECRET>"
  NUXT_PUBLIC_PUSHER_KEY: "<PUSHER_KEY>"
  NUXT_PUBLIC_PUSHER_CLUSTER: "ap1"
  # Public app URL
  NUXT_PUBLIC_APP_URL: "https://nvyt.app"
  # Object storage (Garage — production bucket + key)
  NUXT_S3_ENDPOINT: "http://garage-s3.garage:3900"
  NUXT_S3_REGION: "garage"
  NUXT_S3_ACCESS_KEY_ID: "<GARAGE_PROD_ACCESS_KEY_ID>"
  NUXT_S3_SECRET_ACCESS_KEY: "<GARAGE_PROD_SECRET_ACCESS_KEY>"
  NUXT_S3_BUCKET: "nvyt-uploads-prod"
  NUXT_PUBLIC_S3_PUBLIC_URL: "https://uploads.nvyt.app/nvyt-uploads-prod"
  # Cron
  CRON_SECRET: "<LIVE_CRON_SECRET>"
  NUXT_CRON_SECRET: "<LIVE_CRON_SECRET>"
  # Web push (VAPID)
  NUXT_VAPID_PUBLIC_KEY: "<VAPID_PUBLIC_KEY>"
  NUXT_VAPID_PRIVATE_KEY: "<VAPID_PRIVATE_KEY>"
  NUXT_PUBLIC_VAPID_PUBLIC_KEY: "<VAPID_PUBLIC_KEY>"
